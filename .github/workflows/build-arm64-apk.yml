name: Build ARM64 APK (Kotlin + Rust)

on:
  push:
    branches: [feat/arm64-rust-build]
  pull_request:
    branches: [feat/arm64-rust-build]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_NDK_VERSION: '27.3.13750724'
  TERM: dumb
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=process"

jobs:
  build-rust-native:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          
          # Find and use sdkmanager
          SDKMGR=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "Found sdkmanager: $SDKMGR"
          
          if [ -z "$SDKMGR" ]; then
            echo "ERROR: sdkmanager not found"
            ls -la $ANDROID_HOME/
            exit 1
          fi
          
          # Accept licenses and install NDK
          yes | $SDKMGR --sdk_root=$ANDROID_HOME licenses > /dev/null 2>&1 || true
          $SDKMGR --sdk_root=$ANDROID_HOME "ndk;${{ env.ANDROID_NDK_VERSION }}" 2>&1
          
          echo "=== Installed NDK versions ==="
          ls -la $ANDROID_HOME/ndk/
          
          # Verify toolchain
          TOOLCHAIN="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "=== Toolchain ==="
          ls $TOOLCHAIN/ | grep -E "clang|ar" | head -5

      - name: Build Rust library for arm64-v8a
        run: |
          cd rust
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export AR=llvm-ar
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++
          export CFLAGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export LDFLAGS="-Wl,-rpath,$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid -C link-arg=-llog -C link-arg=-lunwind"
          
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release 2>&1
          
          echo "=== Rust library built ==="
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/
          file ../android/app/src/main/jniLibs/arm64-v8a/libpilinara_native.so

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/
          retention-days: 7

  build-kotlin:
    name: Build Kotlin Android App (ARM64)
    needs: [build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download Rust library
        uses: actions/download-artifact@v4
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Verify native library
        run: |
          echo "=== Checking native libs ==="
          ls -la ./android/app/src/main/jniLibs/arm64-v8a/
          file ./android/app/src/main/jniLibs/arm64-v8a/libpilinara_native.so

      - name: Build Kotlin APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          
          # 明确检查 APK 输出
          echo "=== Looking for APK files ==="
          echo "Searching in: $(pwd)"
          find . -name "*.apk" -type f 2>/dev/null | while read apk; do
            echo "FOUND APK: $apk"
            ls -la "$apk"
          done
          
          echo "=== Build outputs directory ==="
          ls -laR app/build/outputs/ 2>/dev/null | head -50

      - name: Collect APK
        run: |
          mkdir -p /tmp/apks
          find android -name "*.apk" -type f -exec cp {} /tmp/apks/ \; 2>/dev/null || true
          echo "=== Collected APKs ==="
          ls -la /tmp/apks/
          if [ -z "$(ls -A /tmp/apks/)" ]; then
            echo "WARNING: No APK files found!"
            echo "Build output tree:"
            find android/app/build -type f -name "*.apk" 2>/dev/null || echo "No .apk files in build"
            find android/app/build -type d 2>/dev/null | head -20
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilinara-arm64-apk
          path: /tmp/apks/
          retention-days: 7
          if-no-files-found: error

  verify-build:
    name: Verify Build Artifacts
    needs: [build-kotlin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Display build summary
        run: |
          echo "==================================="
          echo "  PiliNara ARM64 Build Summary"
          echo "==================================="
          echo ""
          echo "Build Architecture: arm64-v8a (ARMv8 64-bit)"
          echo "Min SDK: 24 (Android 7.0)"
          echo "Target SDK: 34 (Android 14)"
          echo "Compile SDK: 34"
          echo ""
          echo "=== Artifacts ==="
          find artifacts -type f \( -name "*.apk" -o -name "*.so" \) 2>/dev/null
          
          echo ""
          echo "=== Rust Library ==="
          ls -la artifacts/rust-lib-arm64/ 2>/dev/null
          
          echo ""
          echo "=== APK Files ==="
          ls -la artifacts/pilinara-arm64-apk/ 2>/dev/null
          
          echo ""
          echo "==================================="
          if [ -f artifacts/pilinara-arm64-apk/*.apk ]; then
            echo "  Build Status: SUCCESS ✅"
          else
            echo "  Build Status: FAILED ❌ - No APK found"
            exit 1
          fi
          echo "==================================="
