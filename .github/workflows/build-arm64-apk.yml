name: Build ARM64 APK (Kotlin + Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_NDK_VERSION: '30.0.16248370'
  TERM: dumb

jobs:
  build-rust-native:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Test quality gate
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 审核54：Rust 依赖缓存——避免每次 CI 全量重编
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: arm64-release

      - name: Setup Android SDK & NDK
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME licenses > /dev/null 2>&1 || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;${{ env.ANDROID_NDK_VERSION }}" 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Rust library for arm64-v8a
        run: |
          cd rust
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export AR=llvm-ar
          export CC=aarch64-linux-android36-clang
          export CXX=aarch64-linux-android36-clang++
          export CFLAGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export LDFLAGS="-Wl,-rpath,$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/36"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android36-clang
          # 16 KB page alignment, required for arm64 native libs on Android 15+.
          export RUSTFLAGS="-C link-arg=-landroid -C link-arg=-llog -C link-arg=-lunwind -C link-arg=-Wl,-z,max-page-size=16384"
          
          cargo ndk --platform 36 -t arm64-v8a -o ../android/app/src/main/jniLibs build --locked --release 2>&1
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/

      # 审核90：Rust 单元测试与 lint 门禁（此前 CI 从不校验，坏代码可直接合并）
      - name: Rust test & clippy
        run: |
          cd rust
          cargo fmt --all -- --check
          cargo test --locked --all-targets 2>&1
          cargo clippy --locked --all-targets -- -D warnings 2>&1

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/
          retention-days: 7

  build-apk:
    name: Build APK (arm64-v8a)
    needs: [build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;36.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Download Rust library
        uses: actions/download-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew :app:assembleDebug --build-cache --no-daemon --stacktrace 2>&1
          # Write the XML even when findings exist. The checker below is the gate.
          ./gradlew :app:lintDebug --build-cache --no-daemon --continue -Dandroid.lint.abortOnError=false 2>&1
          # 不猜报告路径：构建后按实际产物定位并校验存在。
          REPORT=$(find .. -path '*/reports/lint-results-debug.xml' -print -quit)
          [ -n "$REPORT" ] || { echo "::error::Lint XML report not found"; exit 1; }
          python3 ../tests/check_lint_report.py "$REPORT"
          # Fail the build if any ABI other than arm64-v8a was packaged.
          python3 - <<'PY'
          import glob, sys, zipfile
          apks = sorted(glob.glob("../build/app/outputs/apk/debug/*.apk"))
          if not apks:
              sys.exit("no debug apk produced in the configured build directory")
          for apk in apks:
              with zipfile.ZipFile(apk) as z:
                  libs = [n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
                  bad = [n for n in libs if not n.startswith("lib/arm64-v8a/")]
                  if not libs:
                      sys.exit("native libraries missing from " + apk)
                  if bad:
                      sys.exit("non-arm64 native libraries packaged: " + ", ".join(bad))
                  if "lib/arm64-v8a/libpilinara_native.so" not in libs:
                      sys.exit("Rust native library missing from " + apk)
              print("ABI check passed:", apk, len(libs), "arm64-v8a libraries")
          PY
          echo "=== Build complete ==="
          echo "Current dir: $(pwd)"
          echo "Finding APK files..."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found with find"
          echo "Listing outputs..."
          ls -la app/build/outputs/ 2>/dev/null || true
          ls -la app/build/outputs/apk/ 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-debug
          path: |
            build/app/reports/lint-results-debug.xml
            build/app/reports/lint-results-debug.txt
            build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore

      - name: Collect APK files
        run: |
          mkdir -p apk_output
          # Publish only the debug APKs validated by the preceding gate.
          cp build/app/outputs/apk/debug/*.apk apk_output/
          echo "=== Collected APKs ==="
          ls -la apk_output/ || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pilinara-debug
          path: apk_output/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify Build
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts/
      
      - name: Display results
        run: |
          echo "==================================="
          echo "  PiliNara ARM64 Build Summary"
          echo "==================================="
          echo ""
          echo "=== Artifacts ==="
          find artifacts -type f \( -name "*.apk" -o -name "*.so" \) 2>/dev/null | head -20
          echo ""
          echo "=== APK Files ==="
          ls -la artifacts/pilinara-debug/ 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Native Library ==="
          ls -la artifacts/rust-lib-arm64/ 2>/dev/null || echo "No .so found"
          echo ""
          echo "==================================="
          echo "  Build Status: SUCCESS ✅"
          echo "==================================="
