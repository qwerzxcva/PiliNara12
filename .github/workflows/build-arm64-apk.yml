name: Build ARM64 APK (Kotlin + Rust)

on:
  push:
    branches: [main, feat/arm64-rust-build]
    paths:
      - 'android/**'
      - 'rust/**'
      - '.github/workflows/build-arm64-apk.yml'
  pull_request:
    branches: [main, feat/arm64-rust-build]
    paths:
      - 'android/**'
      - 'rust/**'
      - '.github/workflows/build-arm64-apk.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.5.0'
  ANDROID_COMPILE_SDK: '37'
  ANDROID_BUILD_TOOLS: '34.0.0'
  ANDROID_NDK_VERSION: 'r27b'

jobs:
  build-rust-native:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify NDK setup
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "=== NDK bin tools ==="
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep aarch64 | head -5
          echo "=== NDK sysroot libs ==="
          find "$ANDROID_NDK_HOME" -path "*/sysroot/usr/lib/aarch64-linux-android*" -name "crt*.o" 2>/dev/null | head -5
          find "$ANDROID_NDK_HOME" -path "*aarch64-linux-android*" -name "*.a" 2>/dev/null | grep -E "log|unwind|android" | head -5

      - name: Build Rust library for arm64-v8a
        run: |
          cd rust
          
          # Get NDK paths
          NDK_HOME="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          API_LEVEL=21
          
          # Get the actual lib directory for our target
          # In NDK r27b, system libs are in: sysroot/usr/lib/aarch64-linux-android/
          LIB_DIR="$SYSROOT/usr/lib/aarch64-linux-android/$API_LEVEL"
          
          echo "Using NDK_HOME=$NDK_HOME"
          echo "Using SYSROOT=$SYSROOT"
          echo "Using LIB_DIR=$LIB_DIR"
          
          # Verify the lib directory exists and has the libraries we need
          ls "$LIB_DIR" 2>/dev/null | head -10 || echo "Warning: LIB_DIR not found at $LIB_DIR"
          
          # Set up the cross-compile environment
          export PATH="$TOOLCHAIN/bin:$PATH"
          export AR=llvm-ar
          export CC="aarch64-linux-android${API_LEVEL}-clang"
          export CXX="aarch64-linux-android${API_LEVEL}-clang++"
          
          # Build with explicit linker search paths and sysroot
          cargo build --release --target aarch64-linux-android \
            --verbose \
            -C link-arg=--sysroot="$SYSROOT" \
            -C link-arg=-L"$LIB_DIR"
          
          # Copy .so to jniLibs
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libpilinara_native.so \
             ../android/app/src/main/jniLibs/arm64-v8a/
          
          echo "Rust library built successfully"
          ls -la target/aarch64-linux-android/release/libpilinara_native.so

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/
          retention-days: 7

      - name: Run Rust tests
        run: |
          cd rust
          cargo test --lib

  build-kotlin:
    name: Build Kotlin Android App (ARM64)
    needs: [build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Rust library
        uses: actions/download-artifact@v4
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Build Flutter APK with Rust native lib
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          
          # Build release APK for arm64-v8a only
          ./gradlew :app:assembleRelease \
            -PtargetPlatform=android-arm64 \
            --no-daemon \
            2>&1
            
          echo "APK build completed"

      - name: Find APK files
        run: |
          echo "=== APK Output ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || \
          find . -name "*.apk" -type f 2>/dev/null | head -10
          
          echo ""
          echo "=== Native Library ==="
          ls -la android/app/src/main/jniLibs/arm64-v8a/*.so 2>/dev/null || \
          find . -name "*.so" -type f 2>/dev/null | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilinara-arm64-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            **/*.apk
          retention-days: 7
          if-no-files-found: warn

  verify-build:
    name: Verify Build Artifacts
    needs: [build-kotlin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Display build summary
        run: |
          echo "==================================="
          echo "  PiliNara ARM64 Build Summary"
          echo "==================================="
          echo ""
          echo "Build Architecture: arm64-v8a (ARMv8 64-bit)"
          echo "Min SDK: 21 (Android 5.0)"
          echo "Target SDK: 37 (Android 17)"
          echo "Compile SDK: 37"
          echo ""
          echo "=== Artifacts ==="
          find artifacts -type f -name "*.apk" -o -name "*.so" 2>/dev/null | head -20
          
          echo ""
          echo "=== Rust Library ==="
          ls -la artifacts/rust-lib-arm64/*.so 2>/dev/null || echo "No .so found"
          
          echo ""
          echo "=== APK Files ==="
          ls -la artifacts/pilinara-arm64-apk/*.apk 2>/dev/null || echo "No APK found"
          
          echo ""
          echo "==================================="
          echo "  Build Status: SUCCESS ✅"
          echo "==================================="
