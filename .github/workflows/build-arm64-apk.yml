name: Build ARM64 APK (Kotlin + Rust)

on:
  push:
    branches: [feat/arm64-rust-build]
  pull_request:
    branches: [feat/arm64-rust-build]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_NDK_VERSION: '27.3.13750724'
  TERM: dumb

jobs:
  build-rust-native:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 审核54：Rust 依赖缓存——避免每次 CI 全量重编
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: arm64-release

      - name: Setup Android SDK & NDK
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME licenses > /dev/null 2>&1 || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;${{ env.ANDROID_NDK_VERSION }}" 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Build Rust library for arm64-v8a
        run: |
          cd rust
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export AR=llvm-ar
          export CC=aarch64-linux-android24-clang
          export CXX=aarch64-linux-android24-clang++
          export CFLAGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export LDFLAGS="-Wl,-rpath,$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-landroid -C link-arg=-llog -C link-arg=-lunwind"
          
          cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release 2>&1
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/

      # 审核90：Rust 单元测试与 lint 门禁（此前 CI 从不校验，坏代码可直接合并）
      - name: Rust test & clippy
        run: |
          cd rust
          cargo test --all-targets 2>&1
          cargo clippy --all-targets -- -D warnings 2>&1

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/
          retention-days: 7

  build-apk:
    name: Build APK (Multi-ABI)
    needs: [build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download Rust library
        uses: actions/download-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1

          # 审核90：Android Lint 门禁（0 error 0 warning 维持线；回归即构建失败）
          ./gradlew :app:lintDebug --no-daemon 2>&1
          LINT_REPORT=app/build/reports/lint-results-debug.txt
          if [ -f "$LINT_REPORT" ]; then
            cat "$LINT_REPORT"
            if grep -qE "^[0-9]+ errors?, |[1-9][0-9]* errors" "$LINT_REPORT"; then
              echo "::error::Lint regression detected"
              exit 1
            fi
          fi
          
          echo "=== Build complete ==="
          echo "Current dir: $(pwd)"
          echo "Finding APK files..."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found with find"
          echo "Listing outputs..."
          ls -la app/build/outputs/ 2>/dev/null || true
          ls -la app/build/outputs/apk/ 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Collect APK files
        run: |
          mkdir -p apk_output
          # Try multiple possible locations
          find android/app/build -name "*.apk" -exec cp {} apk_output/ \; 2>/dev/null || true
          find . -maxdepth 6 -name "*.apk" -exec cp {} apk_output/ \; 2>/dev/null || true
          echo "=== Collected APKs ==="
          ls -la apk_output/ || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pilinara-debug
          path: apk_output/
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: Verify Build
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts/
      
      - name: Display results
        run: |
          echo "==================================="
          echo "  PiliNara ARM64 Build Summary"
          echo "==================================="
          echo ""
          echo "=== Artifacts ==="
          find artifacts -type f \( -name "*.apk" -o -name "*.so" \) 2>/dev/null | head -20
          echo ""
          echo "=== APK Files ==="
          ls -la artifacts/pilinara-debug/ 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Native Library ==="
          ls -la artifacts/rust-lib-arm64/ 2>/dev/null || echo "No .so found"
          echo ""
          echo "==================================="
          echo "  Build Status: SUCCESS ✅"
          echo "==================================="
