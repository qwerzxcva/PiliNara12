name: Build ARM64 Native Library

on:
  push:
    branches: [feat/arm64-rust-build]
  pull_request:
    branches: [feat/arm64-rust-build]

jobs:
  build-rust-arm64:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27b
        link-to-sdk: true
        
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
        
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
      
    - name: Build Rust library
      run: |
        cd rust
        cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release
        
    - name: Upload native library artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-lib-arm64
        path: android/app/src/main/jniLibs/
        retention-days: 7
        
  verify-build:
    name: Verify Build Configuration
    runs-on: ubuntu-latest
    needs: build-rust-arm64
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Verify native library exists
      run: |
        ls -la android/app/src/main/jniLibs/arm64-v8a/
        file android/app/src/main/jniLibs/arm64-v8a/libpilinara_native.so
